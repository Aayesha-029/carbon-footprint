<!DOCTYPE html>
<html>
<head>
  <title>CarbonTrack Icon Generator</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f0fdf4; margin: 0; }
    h1 { color: #0f172a; margin-bottom: 4px; }
    p { color: #475569; }
    code { background: #dcfce7; padding: 2px 8px; border-radius: 6px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin: 28px 0; }
    .icon-card { background: white; padding: 20px; border-radius: 14px; text-align: center; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    canvas { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 12px; }
    .file-name { font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .file-size { font-size: 11px; color: #64748b; margin-bottom: 12px; }
    .dl-btn {
      display: inline-block;
      padding: 10px 20px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22,163,74,.3);
      transition: all .2s ease;
      width: 100%;
    }
    .dl-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(22,163,74,.42); }
    .dl-btn.done { background: #0f172a; box-shadow: none; }
    .note {
      background: #fef3c7;
      border: 1px solid #fde68a;
      padding: 12px 16px;
      border-radius: 10px;
      color: #92400e;
      font-size: 14px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <h1>🌿 CarbonTrack Icon Generator</h1>
  <p>Click each <strong>Download</strong> button → save all 5 PNGs into <code>reactfrontend/public/icons/</code></p>

  <div class="note">
    ⚠️ <strong>Important:</strong> When Chrome asks "Allow multiple downloads?", click <strong>Allow</strong>. Then click each button below once. Each button downloads one file.
  </div>

  <div class="grid" id="grid"></div>

  <script>
    const PATH_1 = "M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z";
    const PATH_2 = "M2 21c0-3 1.85-5.36 5.08-6";

    const configs = [
      { name: 'icon-192.png',     size: 192, radius: 0.22, padding: 0.12 },
      { name: 'icon-512.png',     size: 512, radius: 0.22, padding: 0.12 },
      { name: 'maskable-192.png', size: 192, radius: 0.00, padding: 0.25 },
      { name: 'maskable-512.png', size: 512, radius: 0.00, padding: 0.25 },
      { name: 'shortcut-96.png',  size: 96,  radius: 0.22, padding: 0.12 },
    ];

    const grid = document.getElementById('grid');

    configs.forEach((cfg, idx) => {
      const wrap = document.createElement('div');
      wrap.className = 'icon-card';

      const canvas = document.createElement('canvas');
      canvas.width = cfg.size;
      canvas.height = cfg.size;
      canvas.id = 'canvas-' + idx;
      wrap.appendChild(canvas);

      const nameDiv = document.createElement('div');
      nameDiv.className = 'file-name';
      nameDiv.textContent = cfg.name;
      wrap.appendChild(nameDiv);

      const sizeDiv = document.createElement('div');
      sizeDiv.className = 'file-size';
      sizeDiv.textContent = `${cfg.size} × ${cfg.size} px`;
      wrap.appendChild(sizeDiv);

      const btn = document.createElement('button');
      btn.className = 'dl-btn';
      btn.textContent = '⬇ Download';
      btn.onclick = () => downloadOne(canvas, cfg.name, btn);
      wrap.appendChild(btn);

      grid.appendChild(wrap);
      drawIcon(canvas, cfg);
    });

    function drawIcon(canvas, cfg) {
      const ctx = canvas.getContext('2d');
      const s = canvas.width;
      ctx.clearRect(0, 0, s, s);

      const grad = ctx.createLinearGradient(0, 0, s, s);
      grad.addColorStop(0, '#22c55e');
      grad.addColorStop(1, '#15803d');

      if (cfg.radius > 0) {
        const r = s * cfg.radius;
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(s - r, 0);
        ctx.quadraticCurveTo(s, 0, s, r);
        ctx.lineTo(s, s - r);
        ctx.quadraticCurveTo(s, s, s - r, s);
        ctx.lineTo(r, s);
        ctx.quadraticCurveTo(0, s, 0, s - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
      } else {
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, s, s);
      }

      const inner = s * (1 - cfg.padding * 2);
      const offset = s * cfg.padding;
      const scale = inner / 24;

      ctx.save();
      ctx.translate(offset, offset);
      ctx.scale(scale, scale);
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = '#ffffff';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.stroke(new Path2D(PATH_1));
      ctx.stroke(new Path2D(PATH_2));
      ctx.restore();
    }

    function downloadOne(canvas, filename, btn) {
      const a = document.createElement('a');
      a.download = filename;
      a.href = canvas.toDataURL('image/png');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      btn.textContent = '✅ Downloaded';
      btn.classList.add('done');
      setTimeout(() => {
        btn.textContent = '⬇ Download again';
        btn.classList.remove('done');
      }, 3000);
    }
  </script>
</body>
</html>
